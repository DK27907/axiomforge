[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Turbopack inlines env vars into its persistent cache. Exclude both the
  # standard .next/cache and Netlify's restored .netlify/.next/cache.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**,.netlify/**,.next/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/simulator"
  to = "/#simulator"
  status = 301

[[redirects]]
  from = "/vault"
  to = "/security-architecture"
  status = 301

[[redirects]]
  from = "/arch"
  to = "/security-architecture"
  status = 301

[[redirects]]
  from = "/docs"
  to = "/faqs"
  status = 301